[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esm3di"
version = "0.1.0"
description = "A fine-tuned ESM model for predicting 3Di structural sequences from viral proteins"
#readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Dave, Dongwook", email = "your.email@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0,<5.0.0",  # Capped: Prevents Transformers 5.x from breaking on older PyTorch
    "numpy>=1.24.0,<2.0.0",         # Capped: Prevents NumPy 2.x from crashing PyTorch 2.2
    "peft>=0.10.0",                 # Bumped: Minimum stable version for modern loading
    "accelerate>=0.20.0",           # Added: Explicitly required by Transformers for weight allocation
    "biopython>=1.80",
    "tqdm>=4.65.0",
    "huggingface_hub>=0.20.0",      # Bumped: Required for proper single-file progress tracking
]

# Optional dependencies for development/training
# [project.optional-dependencies]
# train = [...]
# dev = [...]

[project.scripts]
esm3di-foldseek = "esm3di_new.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["esm3di"]  # FIXED: Pointing directly to the root package directory (removed "src/")