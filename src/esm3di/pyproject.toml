[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esm3di"
version = "0.1.0"
description = "A fine-tuned ESM model for predicting 3Di structural sequences from viral proteins"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Dave, Dongwook, ", email = "your.email@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "peft>=0.4.0",
    "biopython>=1.80",
    "tqdm>=4.65.0",
    "huggingface_hub>=0.14.0",
]

# might want to add this for training/dev...
# [project.optional-dependencies]

# train = [...]
# dev = [...]

[project.scripts]
esm3di-foldseek = "esm3di.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/esm3di"]