name: esm3di_blackwell
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  # FoldSeek for database creation
  - foldseek
  - foldmason=4.dd3c235
  - fasttree>=2.2.0
  # Pip dependencies
  - pip:
      # Stable CUDA 12.8 build, including Blackwell support
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.9.1+cu128
      # Core ML - compatible with ESM++ (Synthyra) and PEFT
      - transformers>=4.45.0,<4.49.0
      - peft>=0.12.0,<0.14.0
      - accelerate>=1.0.0
      - safetensors>=0.4.0
      # Tokenizers
      - sentencepiece>=0.2.0
      - tokenizers>=0.20.0
      - protobuf>=4.0.0
      # Scientific computing
      - numpy>=1.24.0
      - scipy>=1.10.0
      - pandas>=2.0.0
      - scikit-learn>=1.3.0
      # Bioinformatics
      - biopython>=1.80
      # Utilities
      - tqdm>=4.65.0
      - huggingface-hub>=0.20.0
      - einops>=0.7.0
      - tensorboard>=2.14.0
      - pyyaml>=6.0
      - requests>=2.28.0
      - fsspec>=2023.1.0
      # GPU optimization
      - bitsandbytes>=0.42.0
      # Install package in editable mode
      - -e .
      - -e ./training

# =============================================================================
# BLACKWELL GPU (sm_120) INSTALLATION NOTES
# =============================================================================
#
# This spec uses stable PyTorch 2.9.1 with its CUDA 12.8 runtime.
# Blackwell architecture (RTX PRO 4000, RTX 5090, etc.) requires
# a PyTorch build with sm_120 support and a CUDA 12.8-compatible driver
# (Linux driver 570 or newer recommended).
#
# Option 1: Use this conda environment (recommended)
#   conda env create -f environment_blackwell.yml
#   conda activate esm3di_blackwell
#
# Option 2: Manual installation of the same stable build
#   pip install torch==2.9.1+cu128 --index-url https://download.pytorch.org/whl/cu128
#
# Verify Blackwell support:
#   python -c "import torch; print(torch.cuda.get_arch_list())"
#   # Should include 'sm_120' or 'compute_120'
#
# =============================================================================
