name: Build, test and publish Python packages

on:
  pull_request:
  push:
    branches:
      - master
      - harmonize-v2-inference-learning
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check both distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check package versions and release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          core = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          training = tomllib.loads(Path("training/pyproject.toml").read_text())["project"]
          version = core["version"]
          assert version == training["version"], "Package versions must match"
          assert f"esm3di=={version}" in training["dependencies"]
          assert core["optional-dependencies"]["training"] == [f"esm3di-training=={version}"]
          if os.environ["GITHUB_EVENT_NAME"] == "release":
              assert os.environ["RELEASE_TAG"] == f"v{version}", "Release tag must match package versions"
          PY
      - name: Build wheels from source distributions and check PyPI metadata
        run: |
          python -m pip install build twine
          python -m build --outdir dist .
          python -m build --outdir dist training
          python -m twine check --strict dist/*
      - name: Check wheel isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 2, "Expected one wheel per distribution"
          contents = {}
          for wheel in wheels:
              with ZipFile(wheel) as archive:
                  contents[wheel.name] = set(archive.namelist())
          core = next(files for name, files in contents.items() if name.startswith("esm3di-"))
          training = next(files for name, files in contents.items() if name.startswith("esm3di_training-"))
          assert not core & training, "Distributions must not own the same files"
          assert "esm3di/workflow/madroot/mad.py" in core
          forbidden = (
              "esm3di_training/", "esm3di/training/", "experimental/", "iterative",
              "train_mlm.py", "train_3di.py", "prepare_data.py", "losses.py",
              "esmretrain", "hf_publish.py",
          )
          assert not any(part in name for name in core for part in forbidden)
          assert "esm3di_training/train_mlm.py" in training
          assert "esm3di_training/train_3di.py" in training
          assert "esm3di/__init__.py" not in training
          assert not any("experimental/" in name or "iterative" in name for name in training)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  test:
    name: Test installed wheels (Python ${{ matrix.python }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Install and check inference without training dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install dist/esm3di-*.whl pytest
          python -m pip check
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import importlib.util
          import subprocess
          import sys
          from importlib.metadata import distribution
          from pathlib import Path

          for name in ("esm3di_training", "esm3di.training", "pandas", "scipy", "sklearn", "tensorboard"):
              assert importlib.util.find_spec(name) is None, f"Unexpected optional dependency: {name}"
          for entry in distribution("esm3di").entry_points:
              subprocess.run([str(Path(sys.executable).parent / entry.name), "--help"], check=True)
          PY
      - name: Install training add-on and run the offline regression suite
        run: |
          python -m pip install dist/esm3di_training-*.whl
          python -m pip check
          cd "$RUNNER_TEMP"
          python -m pytest -q -c /dev/null --rootdir "$RUNNER_TEMP" \
            --import-mode=importlib "$GITHUB_WORKSPACE/tests"

  publish-testpypi:
    name: Publish both distributions to TestPyPI
    if: github.event_name == 'workflow_dispatch' && vars.PACKAGE_PUBLISHING_ENABLED == 'true'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish both distributions to PyPI
    if: github.event_name == 'release' && vars.PACKAGE_PUBLISHING_ENABLED == 'true'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
