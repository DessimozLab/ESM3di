{% set name = "esm3di" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - esm3di = esm3di.cli:main
    - esm3di-infer = esm3di.inference.cli:main
    - esm3di-cut = esm3di.cutting_cli:main
    - esm3di-predict = esm3di.predict:main
    - esm3di-makefoldseekdb = esm3di.fastas2foldseekdb:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - foldmason 4.dd3c235
    - fasttree >=2.2.0
    - python >=3.10
    - pytorch >=2.7.0
    - transformers >=4.45.0,<4.49.0
    - peft >=0.12.0,<0.14.0
    - accelerate >=1.0.0
    - huggingface_hub >=0.20.0
    - tokenizers >=0.20.0
    - numpy >=1.24.0
    - safetensors >=0.4.0
    - tqdm >=4.65.0
    - einops >=0.7.0
    - biopython >=1.80

test:
  commands:
    - python -c "import esm3di; print(esm3di.__version__)"
    - esm3di-infer --help
    - esm3di-makefoldseekdb --help

about:
  home: https://github.com/DessimozLab/ESM3di
  license: MIT
  license_file: LICENSE
  summary: ESM + PEFT LoRA for 3Di per-residue prediction
  description: |
    ESM3di combines ESM protein language models with PEFT LoRA fine-tuning
    for 3Di per-residue prediction tasks.
  dev_url: https://github.com/DessimozLab/ESM3di

extra:
  recipe-maintainers:
    - DessimozLab
