[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esm3di"
version = "0.2.0"
description = "Lightweight ESM3Di inference, cleavage prediction, and FoldSeek database tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core ML dependencies
    "torch>=2.7.0",
    "transformers>=4.45.0,<4.49.0",   # ESM++ remote code + peft 0.12/0.13 (see requirements.txt)
    "peft>=0.12.0,<0.14.0",           # LoRA adapters
    "accelerate>=1.0.0",              # Required by peft and transformers
    "safetensors>=0.4.0",             # Fast model loading
    
    # Tokenizer dependencies
    "tokenizers>=0.20.0",
    
    # Scientific computing
    "numpy>=1.24.0",
    
    # Bioinformatics
    "biopython>=1.80",
    
    # Utilities
    "tqdm>=4.65.0",
    "huggingface-hub>=0.20.0",
    "einops>=0.7.0",
]

[project.optional-dependencies]
training = ["esm3di-training==0.2.0"]
workflow = [
    "snakemake>=7.8.0",
    "pulp<2.8.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
]
# GPU optimization (requires CUDA)
gpu = [
    "bitsandbytes>=0.42.0",
    "triton>=2.1.0",
]
# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
]
# All optional dependencies
all = [
    "esm3di[training,workflow,gpu,dev]",
]

[project.urls]
Homepage = "https://github.com/DessimozLab/ESM3di"
Repository = "https://github.com/DessimozLab/ESM3di"
Issues = "https://github.com/DessimozLab/ESM3di/issues"

[project.scripts]
esm3di = "esm3di.cli:main"
esm3di-infer = "esm3di.inference.cli:main"
esm3di-cut = "esm3di.cutting_cli:main"
esm3di-predict = "esm3di.predict:main"
esm3di-makefoldseekdb = "esm3di.fastas2foldseekdb:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["esm3di", "esm3di.inference", "esm3di._core", "esm3di.workflow"]

[tool.setuptools.package-data]
"esm3di.workflow" = ["Snakefile", "*.yaml", "rules/*.smk", "scripts/*.py", "envs/*.yaml", "madroot/*.py"]

[tool.pytest.ini_options]
pythonpath = ["src", "training/src"]
testpaths = ["tests"]
