[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esm3di"
version = "0.1.0"
description = "A fine-tuned ESM model for predicting 3Di structural sequences from proteins"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Dave, Dongwook", email = "your.email@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# don't forget to add gpu libs again
dependencies = [
    "torch>=2.0.0",                  # Fully supports legacy systems (including Intel Mac PyTorch 2.2)
    "transformers>=4.40.0,<5.0.0",   # Keeps up-to-date with HF ecosystem
    "numpy>=1.24.0,<2.0.0",
    "peft>=0.10.0",
    "accelerate>=0.20.0",
    "biopython>=1.80",
    "tqdm>=4.65.0",
    "huggingface_hub>=0.20.0",
    "safetensors>=0.4.0",
    "einops>=0.7.0",
]

# Development and testing dependencies
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pandas>=2.0.0",
]

[project.scripts]
esm3di = "esm3di.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/esm3di"]  # Points to your module source folder layout